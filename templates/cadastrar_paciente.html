<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Paciente - MedControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-sm border">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-xl font-bold text-gray-800">👤 Cadastrar Novo Paciente</h1>
            <a href="/" class="text-blue-600 hover:underline text-sm font-semibold">Voltar à Agenda</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4 text-sm">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                <input type="text" name="nome" required class="w-full mt-1 p-2 border rounded bg-white">
            </div>
            
            <div id="telefones-container">
                <label class="block text-sm font-medium text-gray-700">Telefone(s) de Contato</label>
                <div class="flex gap-2 mb-2">
                    <input type="text" name="telefones[]" placeholder="(00) 00000-0000" required class="w-full p-2 border rounded bg-white">
                    <button type="button" onclick="adicionarTelefone()" class="bg-gray-200 px-3 py-2 rounded text-sm font-bold hover:bg-gray-300">+</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">E-mail</label>
                <input type="email" name="email" class="w-full mt-1 p-2 border rounded bg-white">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div><label class="text-sm font-medium text-gray-700">Rua / Avenida</label><input type="text" name="rua" class="w-full mt-1 p-2 border rounded bg-white"></div>
                <div><label class="text-sm font-medium text-gray-700">Número</label><input type="text" name="numero" class="w-full mt-1 p-2 border rounded bg-white"></div>
                <div><label class="text-sm font-medium text-gray-700">Bairro</label><input type="text" name="bairro" class="w-full mt-1 p-2 border rounded bg-white"></div>
                <div><label class="text-sm font-medium text-gray-700">Cidade</label><input type="text" name="cidade" class="w-full mt-1 p-2 border rounded bg-white"></div>
                <div><label class="text-sm font-medium text-gray-700">Estado</label><input type="text" name="estado" class="w-full mt-1 p-2 border rounded bg-white"></div>
                <div><label class="text-sm font-medium text-gray-700">CEP</label><input type="text" name="cep" class="w-full mt-1 p-2 border rounded bg-white"></div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white p-2.5 rounded font-bold hover:bg-blue-700 shadow mt-4">Salvar Paciente</button>
        </form>
    </div>

    <script>
        function adicionarTelefone() {
            const container = document.getElementById('telefones-container');
            const div = document.createElement('div');
            div.className = 'flex gap-2 mb-2';
            div.innerHTML = '<input type="text" name="telefones[]" placeholder="(00) 00000-0000" class="w-full p-2 border rounded bg-white"><button type="button" onclick="this.parentElement.remove()" class="bg-red-200 text-red-700 px-3 py-2 rounded text-sm font-bold hover:bg-red-300">x</button>';
            container.appendChild(div);
        }
    </script>
</body>
</html>

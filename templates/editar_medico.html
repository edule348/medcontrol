<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Medcontrol - Editar Médico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f8fafc] flex flex-col h-screen m-0 select-none overflow-hidden font-sans">
    <header class="w-full h-14 bg-white shadow-sm flex items-center justify-between px-6 border-b border-slate-200 shrink-0">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-staff-snake text-lg text-blue-600"></i>
            <span class="text-xl font-bold text-slate-800">Medcontrol</span>
        </div>
        <div class="flex items-center space-x-3 text-slate-700 text-sm font-semibold">
            <span>{{ session.get('username') }}</span>
        </div>
    </header>
    <div class="flex flex-1 overflow-hidden">
        <aside class="w-64 bg-[#f0f4f8] border-r border-slate-200 flex flex-col justify-between shrink-0">
            <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <a href="/cadastros/medicos" class="flex items-center space-x-3 px-3 py-2.5 rounded bg-blue-100 text-blue-950 font-bold"><i class="fa-solid fa-arrow-left w-4 text-blue-600"></i><span>Voltar aos Médicos</span></a>
            </nav>
        </aside>
        <main class="flex-1 p-8 overflow-y-auto max-w-2xl mx-auto space-y-6">
            <h2 class="font-bold text-slate-800 text-base uppercase border-b pb-2">Editar Cadastro de Médico</h2>
            <form action="/medicos/editar/{{ medico.id }}" method="POST" class="bg-white p-6 rounded shadow-sm border border-slate-200 space-y-4 text-xs">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Nome do Médico:</label>
                        <input type="text" name="nome" value="{{ medico.nome }}" required class="w-full border rounded p-2 bg-white">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Especialidade:</label>
                        <input type="text" name="especialidade" value="{{ medico.especialidade }}" required class="w-full border rounded p-2 bg-white">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Telefone:</label>
                        <input type="text" name="telefone" value="{{ medico.telefone }}" class="w-full border rounded p-2 bg-white">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">E-mail:</label>
                        <input type="email" name="email" value="{{ medico.email }}" class="w-full border rounded p-2 bg-white">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Tempo de Consulta:</label>
                        <input type="text" name="tempo_consulta" value="{{ medico.tempo_consulta }}" class="w-full border rounded p-2 bg-white">
                    </div>
                </div>
                <div class="flex justify-end space-x-2 pt-4">
                    <a href="/cadastros/medicos" class="bg-slate-400 hover:bg-slate-500 text-white font-bold px-4 py-2 rounded">Cancelar</a>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded">Salvar Alterações</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
